name: Scripts Tests

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"
      - ".github/workflows/scripts-tests.yml"
  pull_request:
    paths:
      - "scripts/**"
      - ".github/workflows/scripts-tests.yml"

concurrency:
  group: scripts-tests-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scripts-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run scripts unit tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s scripts/tests -v
